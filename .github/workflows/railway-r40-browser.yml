name: R40 railway offline worker and replay acceptance
on:
  pull_request:
    paths:
      - 'src/rail/**'
      - 'tests/fixtures/railway-r39.ts'
      - 'scripts/r40-browser.mjs'
      - '.github/workflows/railway-r40-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Real worker and durable offline replay
        shell: bash
        run: |
          set -euo pipefail
          npm exec vite -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/r40-vite.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/r40-browser.mjs
